# Declarative NCS build targets. Add boards/samples by appending rows.
manifest:
  url: https://github.com/nrfconnect/sdk-nrf
  revision: main

defaults:
  sysbuild: true
  pristine: true

targets:
  - id: nrf9151dk-net-download
    board: nrf9151dk/nrf9151/ns
    sample: samples/net/download
    sysbuild: true
    pristine: true
    extra_west_args: []
    hex_globs:
      - "**/zephyr.hex"
    verify:
      flash:
        tool: nrfutil
      serial:
        # Override with --serial or NCS_SERIAL_DEVICE if auto picks the wrong ACM port.
        device: auto
        baud: 115200
      expect:
        # Zephyr kernel banner after reset (phase 2 v1 — no network checks yet).
        - pattern: "Booting Zephyr OS"
          timeout_s: 90
