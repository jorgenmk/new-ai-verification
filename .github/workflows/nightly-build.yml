name: Nightly NCS build matrix

on:
  schedule:
    # 02:00 UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout verification repo
        uses: actions/checkout@v4

      - name: Install base packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 python3-pip

      - name: Bootstrap west workspace, toolchain, and build matrix
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          bash scripts/west-bootstrap.sh
          bash scripts/setup-toolchain.sh
          # shellcheck source=/dev/null
          source scripts/source-ncs-toolchain-env.sh
          __source_ncs_toolchain_env "$(pwd)"
          bash scripts/west-update.sh
          bash scripts/build-matrix.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncs-build-matrix
          path: |
            artifacts/build-manifest.json
            artifacts/**/*.hex
          if-no-files-found: error
